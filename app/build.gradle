apply plugin: 'com.android.application'

android {
    namespace 'com.sentinel.lock'
    compileSdk 34

    defaultConfig {
        applicationId "com.sentinel.lock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        // Ensure instrumentation test APK uses a different applicationId to avoid package collision
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testApplicationId "com.sentinel.lock.test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions {
        noCompress "tflite"
    }

    buildFeatures {
        // enable viewBinding if you want to use it later
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'com.google.android.material:material:1.11.0'

    // ConstraintLayout for layout files using androidx.constraintlayout.widget.ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CameraX
    def camerax_version = "1.3.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Face Detection (on-device)
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // TensorFlow Lite runtime
    // Using the runtime specifically to avoid conflicts if api is also pulled in
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // Guava (CameraX uses ListenableFuture)
    implementation 'com.google.guava:guava:33.0.0-android'

    // EncryptedSharedPreferences for secure embedding storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
